name: Daily LinkedIn Post

on:
  schedule:
    # 9:00 AM CDT (Memphis) = 14:00 UTC  — runs Mon–Fri
    - cron: '0 14 * * 1-5'
  workflow_dispatch:          # also allows manual "Run workflow" button in GitHub UI

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # needed to commit the "posted: true" flag back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Playwright + Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run posting script
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN:   ${{ secrets.LINKEDIN_PERSON_URN }}
          CANVA_API_TOKEN:       ${{ secrets.CANVA_API_TOKEN }}
          CANVA_TEMPLATE_ID:     ${{ secrets.CANVA_TEMPLATE_ID }}
        run: python scripts/post.py
